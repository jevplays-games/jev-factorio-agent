[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-factorio"
version = "0.1.0"
description = "A Jev-powered (TypeSafe System One) agent that plays Factorio"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Timothy Wayne Gregg", email = "timothy.gregg@complete.tech" },
]
maintainers = [
    { name = "Timothy Wayne Gregg", email = "timothy.gregg@complete.tech" },
]
dependencies = [
    # TypeSafe Python SDK: https://docs.typesafe.ai/sdk/python.md
    # Uncomment when you have a key (TypeSafe console, or route via Vercel AI Gateway).
    # "typesafe-sdk",
    # Pinned async transport; async provider support is explicit and opt-in.
    "httpx==0.28.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
evaluation = ["pyarrow>=14"]
fle = [
    "factorio-learning-environment==0.4.3",
    "a2a-sdk>=0.3,<1",
]
test = [
    "pytest>=8,<10",
    "lupa==2.8",
]

dashboard-test = [
    "pytest>=8,<10",
    "playwright==1.57.0",
]

[project.urls]
Homepage = "https://github.com/jevplays-games/jev-factorio-agent"
Repository = "https://github.com/jevplays-games/jev-factorio-agent"
Author = "https://github.com/CompleteDotTech"
Company = "https://www.complete.tech"

[project.scripts]
jev-factorio = "jev_factorio.main:cli"
jev-factorio-dashboard = "jev_factorio.dashboard:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_factorio = ["lua/*.lua", "dashboard_assets/*.html", "dashboard_assets/*.css", "dashboard_assets/*.js", "dashboard_assets/*.png"]
