name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || (github.run_attempt == '1' && github.ref || format('rerun-{0}-{1}', github.run_id, github.run_attempt)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Capture exact tracked source for reproducible offline review
        if: matrix.python-version != '3.10'
        run: |
          mkdir -p /tmp/review-evidence
          git archive --format=tar.gz --output=/tmp/review-evidence/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/review-evidence/source-commit.txt
          sha256sum /tmp/review-evidence/source.tar.gz > /tmp/review-evidence/SHA256SUMS
      - run: python -m pip install -e '.[test]'
      - name: Retain the declared Lua test dependency for offline review
        if: matrix.python-version == '3.13'
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest /tmp/review-evidence/wheels 'lupa==2.8'
          cd /tmp/review-evidence
          sha256sum wheels/*.whl > WHEEL-SHA256SUMS
      - run: python -m pytest tests/ -q --junitxml=/tmp/review-evidence/pytest.xml
      - run: python -m compileall -q src
      - name: Explicit offline hierarchical smoke test
        run: >-
          python -m jev_factorio --controller hierarchical --backend mock
          --mock-model --target bootstrap_mining --steps 40 --tick-seconds 0
          --checkpoint /tmp/campaign.json --log-file /tmp/campaign.jsonl
          --run-dir /tmp/research-evidence
      - run: python -m jev_factorio.evaluation /tmp/campaign.jsonl
      - name: Verify complete research evidence
        run: python -m jev_factorio.research_log /tmp/research-evidence
      - name: Publish offline review evidence
        if: always() && matrix.python-version != '3.10'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-review-${{ github.sha }}-${{ matrix.python-version }}
          path: /tmp/review-evidence/
          retention-days: 7
          if-no-files-found: error
  research-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[evaluation]' pytest duckdb
      - name: Offline research, Parquet, and DuckDB round trips
        run: python -m pytest tests/test_research_evaluation.py tests/test_research_core_evaluation.py -q
