name: Dashboard browser tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || (github.run_attempt == '1' && github.ref || format('rerun-{0}-{1}', github.run_id, github.run_attempt)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install built package including its static assets
        run: python -m pip install '.[dashboard-test]'
      - run: python -m playwright install --with-deps chromium
      - name: Reader, real controller equivalence, and live browser tests
        run: python -m pytest tests/test_dashboard.py tests/test_dashboard_integration.py tests/test_dashboard_browser.py tests/test_dashboard_evidence_pr25.py tests/test_dashboard_evidence_pr25_browser.py -q
